AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM role for cross-account access by OpsGuru.


Parameters:

  CreateManagedPolicyRole:
    Type: String
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"
    Description: >
      Select "Yes" to create the managed policy role.

  CreatePredefinedRole:
    Type: String
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"
    Description: >
      Select "Yes" to create the predefined role.

  ManagedPolicyArn:
    Type: String
    Default: ""
    AllowedValues:
      - ""
      - arn:aws:iam::aws:policy/AdministratorAccess
      - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
      - arn:aws:iam::aws:policy/AWSBillingReadOnlyAccess
      - arn:aws:iam::aws:policy/ReadOnlyAccess
    Description: >
      The AWS managed policy attached to attach to the managed policy role, if created.

  ManagedPolicyRoleName:
    Type: String
    Description: >
      Name of the managed policy IAM role.

  PredefinedRole:
    Type: String
    Default: ""
    AllowedValues:
      - ""
      - ProwlerScanRole
    Description: >
      The predefined role to create, if created.

  PredefinedRoleName:
    Type: String
    Description: >
      Name of the predefined IAM role.

  Principal:
    Type: String
    Description: >
      Amazon Resource Name (ARN) of the principal that can assume the IAM role(s) created in your AWS account.


Metadata:

  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Principal to Assume Role(s)
        Parameters:
          - Principal
      - Label:
          default: Managed Policy Role
        Parameters:
          - CreateManagedPolicyRole
          - ManagedPolicyRoleName
          - ManagedPolicyArn
      - Label:
          default: Predefine Role
        Parameters:
          - CreatePredefinedRole
          - PredefinedRoleName
          - PredefinedRole
    ParameterLabels:
      CreateManagedPolicyRole:
        default: Create Managed Policy Role?
      CreatePredefinedRole:
        default: Create Predefined Role?
      ManagedPolicyArn:
        default: Managed Policy ARN
      ManagedPolicyRoleName:
        default: Managed Policy Role Name (Value Provided by OpsGuru)
      PredefinedRole:
        default: Predefined Role
      PredefinedRoleName:
        default: Predefined Role Name (Value Provided by OpsGuru)
      Principal:
        default: Principal (Value Provided by OpsGuru)


Conditions:

  CreateManagedPolicyRole:
    Fn::Equals:
      - Ref: CreateManagedPolicyRole
      - "Yes"

  CreatePredefinedRole:
    Fn::Equals:
      - Ref: CreatePredefinedRole
      - "Yes"

  ProwlerScanRole:
    Fn::Equals:
      - Ref: PredefinedRole
      - ProwlerScanRole

  CreateProwlerScanRole:
    Fn::And:
      - Condition: CreatePredefinedRole
      - Condition: ProwlerScanRole


Resources:

  ManagedPolicyRole:
    Condition: CreateManagedPolicyRole
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: ManagedPolicyRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Ref: Principal
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ManagedPolicyArn

  ProwlerScanRole:
    Condition: CreateProwlerScanRole
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Ref: PredefinedRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            AWS:
              Ref: Principal
          Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
      Policies:
        - PolicyName: ProwlerScanRoleAdditionalViewPrivileges
          PolicyDocument:
            Version : '2012-10-17'
            Statement:
            - Effect: Allow
              Action:
                - 'account:Get*'
                - 'appstream:Describe*'
                - 'appstream:List*'
                - 'backup:List*'
                - 'cloudtrail:GetInsightSelectors'
                - 'codeartifact:List*'
                - 'codebuild:BatchGet*'
                - 'cognito-idp:GetUserPoolMfaConfig'
                - 'dlm:Get*'
                - 'drs:Describe*'
                - 'ds:Get*'
                - 'ds:Describe*'
                - 'ds:List*'
                - 'dynamodb:GetResourcePolicy'
                - 'ec2:GetEbsEncryptionByDefault'
                - 'ec2:GetSnapshotBlockPublicAccessState'
                - 'ec2:GetInstanceMetadataDefaults'
                - 'ecr:Describe*'
                - 'ecr:GetRegistryScanningConfiguration'
                - 'elasticfilesystem:DescribeBackupPolicy'
                - 'glue:GetConnections'
                - 'glue:GetSecurityConfiguration*'
                - 'glue:SearchTables'
                - 'lambda:GetFunction*'
                - 'logs:FilterLogEvents'
                - 'lightsail:GetRelationalDatabases'
                - 'macie2:GetMacieSession'
                - 's3:GetAccountPublicAccessBlock'
                - 'shield:DescribeProtection'
                - 'shield:GetSubscriptionState'
                - 'securityhub:BatchImportFindings'
                - 'securityhub:GetFindings'
                - 'ssm:GetDocument'
                - 'ssm-incidents:List*'
                - 'support:Describe*'
                - 'tag:GetTagKeys'
                - 'wellarchitected:List*'
              Resource: '*'
        - PolicyName: ProwlerScanRoleAdditionalViewPrivilegesApiGateway
          PolicyDocument:
            Version : '2012-10-17'
            Statement:
            - Effect: Allow
              Action:
                - 'apigateway:GET'
              Resource: 'arn:aws:apigateway:*::/restapis/*'


Outputs:

  ManagedPolicyRoleArn:
    Condition: CreateManagedPolicyRole
    Description: Amazon Resource Name (ARN) of the IAM role with managed policy attached
    Value:
      Fn::GetAtt: ManagedPolicyRole.Arn

  ProwlerScanRoleArn:
    Condition: CreateProwlerScanRole
    Description: Amazon Resource Name (ARN) of the IAM role for running Prowler scans
    Value:
      Fn::GetAtt: ProwlerScanRole.Arn
